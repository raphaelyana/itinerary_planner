[pytest]
testpaths = tests
markers =
    slow: tests that run a full OR-Tools solve (several seconds each)

# The legacy suite targets the Neo4j-backed planner in scripts/. It needs a live
# database and a `scripts.benchmarks` module that no longer exists, so it breaks
# collection for everyone. Run it explicitly when working on that stack:
#   pytest tests/test_planner.py
addopts =
    --ignore=tests/test_api.py
    --ignore=tests/test_benchmarks.py
    --ignore=tests/test_planner.py

filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap

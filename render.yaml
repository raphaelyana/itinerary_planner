services:
  # FastAPI backend for itinerary planning
  # Now uses Neo4j Aura (cloud-hosted) instead of self-hosted Neo4j
  - type: web
    name: versailles-planner-api
    runtime: python
    plan: starter # 512 MB RAM, 0.5 CPU
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scripts.api:app --host 0.0.0.0 --port $PORT
    envVars:
      # All Neo4j connection details managed in Render Dashboard
      # pointing to Neo4j Aura instance: 4100001d
      - key: NEO4J_URI
        sync: false  # Set to: neo4j+s://4100001d.databases.neo4j.io
      - key: NEO4J_USERNAME
        sync: false  # Set to: neo4j
      - key: NEO4J_PASSWORD
        sync: false  # Aura password from dashboard
      - key: NEO4J_DATABASE
        value: neo4j
      - key: PLANNER_LOG_LEVEL
        value: DEBUG
    healthCheckPath: /health

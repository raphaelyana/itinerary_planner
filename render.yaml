services:
  # Neo4j Graph Database
  - type: pserv
    name: versailles-neo4j
    runtime: docker
    plan: standard  # Neo4j requires persistent storage (not available on free tier)
    dockerfilePath: ./Dockerfile.neo4j
    dockerContext: .
    disk:
      name: neo4j-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NEO4J_AUTH
        sync: false  # Secret managed in Render dashboard
      - key: NEO4J_server_memory_heap_initial__size
        value: 256m
      - key: NEO4J_server_memory_heap_max__size
        value: 384m
      - key: NEO4J_server_memory_pagecache_size
        value: 64m
      - key: NEO4J_dbms_memory_transaction_total_max
        value: 128m

  # FastAPI backend for itinerary planning
  - type: web
    name: versailles-planner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scripts.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEO4J_URI
        value: neo4j://versailles-neo4j:7687  # Internal hostname (safe to expose)
      - key: NEO4J_USERNAME
        value: neo4j  # Standard username (safe to expose)
      - key: NEO4J_PASSWORD
        sync: false  # Secret managed in Render dashboard
      - key: NEO4J_DATABASE
        value: neo4j
      - key: PLANNER_LOG_LEVEL
        value: DEBUG
    healthCheckPath: /health

  # One-time data ingestion job
  - type: worker
    name: versailles-ingest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/ingest.py
    envVars:
      - key: NEO4J_URI
        value: neo4j://versailles-neo4j:7687  # Internal hostname (safe to expose)
      - key: NEO4J_USERNAME
        value: neo4j  # Standard username (safe to expose)
      - key: NEO4J_PASSWORD
        sync: false  # Secret managed in Render dashboard
      - key: NEO4J_DATABASE
        value: neo4j

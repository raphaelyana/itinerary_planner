services:
  # FastAPI backend for itinerary planning
  # Now uses Neo4j Aura (cloud-hosted) instead of self-hosted Neo4j
  - type: web
    name: versailles-planner-api
    runtime: python
    plan: starter # 512 MB RAM, 0.5 CPU
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scripts.api:app --host 0.0.0.0 --port $PORT
    envVars:
      # All Neo4j connection details must be set in Render Dashboard
      # These variables are marked as sync: false to pull from Dashboard secrets
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: AURA_INSTANCEID
        sync: false
      - key: AURA_INSTANCENAME
        sync: false
      - key: PLANNER_LOG_LEVEL
        value: DEBUG
    healthCheckPath: /health
